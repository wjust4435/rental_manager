image: ghcr.io/cirruslabs/flutter:stable

variables:
  SECURE_FILES_DOWNLOAD_PATH: './.gitlab/secure_files/'
  # Explicitly set Java 17 to match build.gradle.kts and resolve obsolete source warnings
  JAVA_VERSION: "17"
  # This creates a permanent base URL for your APKs in the Package Registry
  PACKAGE_URL: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/RentalManager/${CI_COMMIT_TAG}"

stages:
  - build
  - deploy

build_job:
  stage: build
  script:
    - java -version
    - echo "Downloading secure keystore..."
    - curl -sL https://gitlab.com/gitlab-org/incubation-engineering/mobile-devops/download-secure-files/-/raw/main/installer | bash
    - flutter pub get
    - flutter build apk --release --split-per-abi
    - cd build/app/outputs/flutter-apk/
    # Rename for professional look
    - mv app-armeabi-v7a-release.apk "Rental_Manager_${CI_COMMIT_TAG}_armeabi-v7a.apk"
    - mv app-arm64-v8a-release.apk "Rental_Manager_${CI_COMMIT_TAG}_arm64-v8a.apk"
    - mv app-x86_64-release.apk "Rental_Manager_${CI_COMMIT_TAG}_x86_64.apk"
    # NEW: Upload APKs to the permanent Package Registry
    - |
      for apk in Rental_Manager_${CI_COMMIT_TAG}_*.apk; do
        curl --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file "$apk" "${PACKAGE_URL}/$apk"
      done
  artifacts:
    paths:
      - build/app/outputs/flutter-apk/Rental_Manager_*.apk
    expire_in: 1 day
  rules:
    - if: $CI_COMMIT_TAG

release_job:
  stage: deploy
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: build_job
      artifacts: true
  script:
    - echo "Generating Release page for $CI_COMMIT_TAG..."
  release:
    name: "Rental Manager $CI_COMMIT_TAG"
    description: "Official release for version $CI_COMMIT_TAG. Licensed under GNU GPL v3."
    tag_name: "$CI_COMMIT_TAG"
    assets:
      links:
        - name: "ARM 64-bit (Modern Phones)"
          url: "${PACKAGE_URL}/Rental_Manager_${CI_COMMIT_TAG}_arm64-v8a.apk"
        - name: "ARM 32-bit (Older Phones)"
          url: "${PACKAGE_URL}/Rental_Manager_${CI_COMMIT_TAG}_armeabi-v7a.apk"
        - name: "x86_64 (Emulators)"
          url: "${PACKAGE_URL}/Rental_Manager_${CI_COMMIT_TAG}_x86_64.apk"
  rules:
    - if: $CI_COMMIT_TAG
