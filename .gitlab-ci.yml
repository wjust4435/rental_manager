image: ghcr.io/cirruslabs/flutter:stable

stages:
  - build
  - deploy

variables:
  # This tells the downloader where to put your .jks file
  SECURE_FILES_DOWNLOAD_PATH: './android/app/'

build_job:
  stage: build
  script:
    - echo "Fetching secure keystore..."
    - curl -sL https://gitlab.com/gitlab-org/incubation-engineering/mobile-devops/download-secure-files/-/raw/main/installer | bash
    - echo "Building Signed APK for v2.5.0..."
    - flutter pub get
    - flutter build apk --release
  artifacts:
    paths:
      - build/app/outputs/flutter-apk/app-release.apk
    expire_in: 7 days
  rules:
    - if: $CI_COMMIT_TAG # Runs when you push a tag like v2.5.0
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH # Runs on every push to main

release_job:
  stage: deploy
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: build_job
      artifacts: true
  script:
    - echo "Creating official GitLab Release..."
  release:
    name: "Release $CI_COMMIT_TAG"
    description: "Rental Manager v2.5.0 - Database Schema v21"
    tag_name: "$CI_COMMIT_TAG"
    assets:
      links:
        - name: "Rental Manager APK"
          url: "${CI_PROJECT_URL}/-/jobs/${CI_JOB_ID}/artifacts/raw/build/app/outputs/flutter-apk/app-release.apk"
  rules:
    - if: $CI_COMMIT_TAG # Only creates a 'Release' page when you push a tag