image: ghcr.io/cirruslabs/flutter:stable

variables:
  # This MUST match the path in your build.gradle.kts
  SECURE_FILES_DOWNLOAD_PATH: './.gitlab/secure_files/'

stages:
  - build
  - deploy

build_job:
  stage: build
  script:
    - echo "Fetching secure keystore..."
    - curl -sL https://gitlab.com/gitlab-org/incubation-engineering/mobile-devops/download-secure-files/-/raw/main/installer | bash
    - echo "Building Signed APK..."
    - flutter pub get
    - flutter build apk --release
  artifacts:
    paths:
      - build/app/outputs/flutter-apk/app-release.apk
    expire_in: 7 days
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

release_job:
  stage: deploy
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: build_job
      artifacts: true
  script:
    - echo "Creating official GitLab Release..."
  release:
    name: "Release $CI_COMMIT_TAG"
    description: "Rental Manager v2.5.0"
    tag_name: "$CI_COMMIT_TAG"
    assets:
      links:
        - name: "Rental Manager APK"
          url: "${CI_PROJECT_URL}/-/jobs/${CI_JOB_ID}/artifacts/raw/build/app/outputs/flutter-apk/app-release.apk"
  rules:
    - if: $CI_COMMIT_TAG